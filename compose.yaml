# Portainer stack (or `docker compose up -d`) for Unraid. One container; all state lives in
# /mnt/user/appdata/hidden-isle (database, rules snapshots, backups, session and deploy keys).
#
# Before the first start, create the folder owned by the user the container runs as:
#   mkdir -p /mnt/user/appdata/hidden-isle && chown 99:100 /mnt/user/appdata/hidden-isle
services:
  hidden-isle:
    image: ghcr.io/fwump38/hidden-isle-app:latest
    container_name: hidden-isle
    restart: unless-stopped
    user: "99:100"             # Unraid's nobody:users, the usual appdata owner
    ports:
      - "8390:8080"            # LAN web UI (PIN login). Never forward this to the internet.
      - "8391:8081"            # Tunnel listener (SSO or MCP bearer token required). Point cloudflared here
                               # (http://<unraid-ip>:8391); drop this line if cloudflared shares a Docker network
                               # with this container and uses http://hidden-isle:8081 instead.
    volumes:
      - /mnt/user/appdata/hidden-isle:/data
    labels:
      - net.unraid.docker.webui=http://[IP]:[PORT:8390]
    environment:
      HI_PUBLIC_URL: https://isle.slothcorp.com     # the tunnel hostname
      HI_SEER_NAME: Seer
      HI_SEER_EMAIL: you@example.com                # the email on your Authentik user
      HI_SEER_PASSWORD: ${HI_SEER_PASSWORD}          # your password for signing in at home (8+ characters)
      # Authentik OAuth2 provider (docs/authentik-setup.md): claude.ai MCP + "Sign in with Authentik" away from home
      HI_OAUTH_ISSUER: https://auth.example.com/application/o/hidden-isle/
      HI_OAUTH_AUDIENCE: ${HI_OAUTH_CLIENT_ID}
      HI_OAUTH_CLIENT_SECRET: ${HI_OAUTH_CLIENT_SECRET}
      # Home detection is on by default: tunnel requests from the house's public IP get PIN sign-in.
      # HI_HOME_NETWORKS: 2001:db8:1:2::/64         # extra networks that always count as home
      # HI_LAN_CIDR: 192.168.1.0/24                 # PIN sign-in on the local address only from these ranges
      # Rules data: pinned releases over SSH with a read-only deploy key (copy it from Admin).
      GAMEDATA_REPO: git@github.com:fwump38/The-Hidden-Isle.git
      GAMEDATA_REF: release                         # or a fixed release like v1.2.0, or a branch like main
      GAMEDATA_INTERVAL: 1h                         # how often to check for new releases
      # In-app AI assistance (creation wizard suggestions, and more), on your own Anthropic billing.
      # Leave unset to keep it off. Console API key, not your claude.ai subscription.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # HI_AI_MONTHLY_CAP_USD: 20                    # table-wide monthly spend cap (0 = no cap)
      # HI_AI_PLAYER_CAP_USD: 5                      # per-player monthly spend cap (0 = no cap)
